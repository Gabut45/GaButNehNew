plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.ujicoba.gabut'
    compileSdk 36

    defaultConfig {
        applicationId "com.ujicoba.gabut"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "MAIN_URL", "\"${baseUrl}\"")
        buildConfigField("String", "SECRET_KEY", "\"${apiKey}\"")
        manifestPlaceholders = [
                admobAppId: project.findProperty("admobAppId") ?: "ca-app-pub-3940256854942544~3344561713",
                applovinSdkKey: project.findProperty("applovinSdkKey") ?: "lCed4bgf8m9W0EaHrx-MlZmfao0sHHZp6XxqFAu7wUfFdmw0kW6CQlnVpsqegHoM7xld674VsEzraMyl6KoGym"
        ]
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    viewBinding {
        enabled = true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0' // Circle Image View
    implementation 'com.intuit.sdp:sdp-android:1.1.1' // 27/03/2024 versi stabil Responsive Screen
    implementation "androidx.multidex:multidex:2.0.1" // Multidex
    implementation 'com.github.bumptech.glide:glide:4.16.0' // Glide
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0' // Glide
    //implementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.20" // 23/06/2025 versi stabil Kotlin
    implementation 'com.github.ibrahimsn98:SmoothBottomBar:1.7.9' // Bottom Nav
    implementation project(':library')
    implementation 'com.makeramen:roundedimageview:2.3.0' // Rounded ImageView
    implementation 'com.airbnb.android:lottie:6.1.0' // Lottie
    implementation 'io.github.francoiscampbell:circlelayout:0.3.0' // Circle Layout
    implementation 'com.android.volley:volley:1.2.1' // Volley
    implementation 'com.google.android.gms:play-services-auth:21.6.0' // 23/79/2025 Google Sign In
    implementation "androidx.security:security-crypto:1.1.0" // Encrypted SharedPref
    implementation 'com.facebook.shimmer:shimmer:0.5.0' // Shimmer Effect
    implementation 'androidx.browser:browser:1.10.0' // Chrome Tab
    implementation 'com.google.android.gms:play-services-ads:25.5.0' // 16/03/2025 Google Ads Manager


    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.core:core:1.17.0' // ojo kesusu di update

    implementation "androidx.lifecycle:lifecycle-process:2.11.0" // ojo kesusu di update
    implementation "androidx.lifecycle:lifecycle-runtime:2.11.0" // ojo kesusu di update

    //ad networks
    implementation 'androidx.annotation:annotation:1.11.0'  // 30/10/2024
    implementation 'com.applovin:applovin-sdk:13.6.4' // 30/03/2026 Applovin
    implementation 'com.applovin.mediation:facebook-adapter:6.22.0.1' // 28/10/2025 MAX BID FAN
    implementation 'com.applovin.mediation:ironsource-adapter:9.6.1.0.0' // 01/04/2026 MAX BID ironsource

    implementation platform('com.google.firebase:firebase-bom:35.0.0')  // 18/09/2025
    implementation 'com.google.firebase:firebase-messaging:26.0.0'  // 18/09/2025


}